<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب | PENTRA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">

    <!-- الجهة اليمين: بوكس إنشاء الحساب -->
    <section class="login-card">
      <img class="logo" src="images/PentraLogo.png" alt="شعار بنترا">

      <h1 class="title">إنشاء حساب جديد</h1>
      <p class="subtitle">أدخل بياناتك للانضمام إلى PENTRA</p>

      <form class="login-form" id="registerForm" novalidate>

        <!-- الاسم رباعي -->
        <label class="field-label" for="fullName">الاسم رباعي</label>
        <div class="input-wrap">
          <input class="input" type="text" id="fullName" placeholder="أدخل اسمك رباعي كامل" autocomplete="name">
        </div>

        <!-- البريد الالكتروني -->
        <label class="field-label" for="email">البريد الالكتروني</label>
        <div class="input-wrap">
          <input class="input input-end" type="email" id="email" placeholder="أدخل البريد الالكتروني" autocomplete="email">
          <svg class="icon icon-end" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#D0D2D6" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
            <rect x="3" y="7" width="18" height="12" rx="2"/>
            <path d="M3 7l9 7 9-7"/>
            <path d="M3 19l6-6"/>
            <path d="M21 19l-6-6"/>
          </svg>
        </div>

        <!-- الجنس -->
        <label class="field-label" for="gender">الجنس</label>
        <div class="input-wrap">
          <select class="input input-end select" id="gender">
            <option value="" disabled selected>حدد نوع الجنس</option>
            <option value="male">ذكر</option>
            <option value="female">أنثى</option>
          </select>
          <svg class="icon icon-end" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A1A5AD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 10l5 5 5-5"/>
          </svg>
        </div>

        <!-- تاريخ الميلاد -->
        <label class="field-label" for="birthDate">تاريخ الميلاد</label>
        <div class="input-wrap">
          <input class="input input-end date" type="date" id="birthDate">
          <svg class="icon icon-end" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#D0D2D6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="5" width="16" height="15" rx="2"/>
            <path d="M4 10h16"/>
            <path d="M9 3v4M15 3v4"/>
            <path d="M10 14l2 2 2-2"/>
          </svg>
        </div>

        <!-- كلمة المرور -->
        <label class="field-label" for="password">كلمة المرور</label>
        <div class="input-wrap">
          <input class="input input-end" type="password" id="password" placeholder="أدخل كلمة المرور" autocomplete="new-password">
          <button class="eye" type="button" data-target="password" aria-label="إظهار كلمة المرور">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#CECFD2" fill-rule="evenodd">
              <path d="M12 4.5C7 4.5 2.7 7.6 1 12c1.7 4.4 6 7.5 11 7.5s9.3-3.1 11-7.5c-1.7-4.4-6-7.5-11-7.5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
            </svg>
          </button>
        </div>

        <!-- تأكيد كلمة المرور -->
        <label class="field-label" for="confirmPassword">تأكيد كلمة المرور</label>
        <div class="input-wrap">
          <input class="input input-end" type="password" id="confirmPassword" placeholder="أدخل كلمة المرور مرة أخرى" autocomplete="new-password">
          <button class="eye" type="button" data-target="confirmPassword" aria-label="إظهار تأكيد كلمة المرور">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#CECFD2" fill-rule="evenodd">
              <path d="M12 4.5C7 4.5 2.7 7.6 1 12c1.7 4.4 6 7.5 11 7.5s9.3-3.1 11-7.5c-1.7-4.4-6-7.5-11-7.5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
            </svg>
          </button>
        </div>

        <!-- زر إنشاء حساب -->
        <button type="submit" class="btn-login">
          <span>إنشاء حساب</span>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"/>
            <path d="M11 6l-6 6 6 6"/>
          </svg>
        </button>

        <p class="signup">
          <span>لديك حساب ؟</span>
          <a href="login.html" class="link">تسجيل الدخول</a>
        </p>
      </form>
    </section>

    <!-- الجهة اليسار: النص + الكاروسيل (نفس اللوجن) -->
    <section class="hero">
      <h2 class="hero-title">
        <span class="t48">اكتشف مهارتك</span>
        <span><span class="t48">وابدأ</span> <span class="t64 grad">رحلتك التعليمية</span></span>
      </h2>
      <p class="hero-text">في بنترا نساعدك على تحديد مستواك , واختيار المسار التعليمي الأنسب لك لتحقق أهدافك بثقة .</p>

      <div class="stage" id="carousel">
        <img class="slide s1 active" src="images/3D-Blocks.png" alt="">
        <img class="slide s2" src="images/Laptop.png" alt="">
        <img class="slide s3" src="images/3D-Books.png" alt="">
      </div>

      <div class="dots" id="dots">
        <button class="dot active" aria-label="الشريحة 1"></button>
        <button class="dot" aria-label="الشريحة 2"></button>
        <button class="dot" aria-label="الشريحة 3"></button>
      </div>
    </section>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
